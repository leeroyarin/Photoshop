# Personal test installer; official signed builds use release.yml.
name: Build desktop installers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Photoshop Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-installer-windows-x64
      - name: Install WiX packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build personal test installer
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Record checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | Where-Object { $_.Extension -in '.msi', '.zip' } |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Photoshop-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

  installer:
    name: Photoshop universal DMG
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-installer-universal
      - name: Build personal test installer
        run: bash packaging/macos/package.sh --arch universal
      - name: Verify packaged artifacts
        run: bash packaging/macos/verify.sh --arch universal
      - name: Record checksums
        run: |
          cd dist/release
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Photoshop-macos-universal
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Download **Photoshop-macos-universal** from this run's Artifacts section and extract it.
          Open the `.dmg`, then drag **Photoshop** into **Applications**.

          This personal test build supports Apple Silicon and Intel Macs. It is ad-hoc signed,
          not Apple-notarized, so Gatekeeper may block opening it. For a trusted build you made,
          use macOS System Settings > Privacy & Security > Open Anyway if offered.
          Official Developer ID signed and notarized installers use the Release workflow.
          EOF
